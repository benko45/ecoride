# fly.toml app configuration file generated for ecoride-silent-cloud-3328 on 2025-03-26T15:58:03+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

  app = 'ecoride-dev'
  primary_region = 'cdg'

  [build]

  [http_service]
    internal_port = 3000
    force_https = true
    auto_stop_machines = 'stop'
    auto_start_machines = true
    min_machines_running = 2
    processes = ['app']

  [[vm]]
    memory = '1gb'
    cpu_kind = 'shared'
    cpus = 1
    
  [[services]]
    internal_port = 3000
    protocol = "tcp"

    [[services.ports]]
      port = 80